<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taipei NTU Cafes — 隨機選店</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>taipei-ntu-cafes</h1>
    <p>大安 · 台大社科院周邊 | 不限時、有插座、明亮照明</p>
    <button id="pickBtn" class="btn">隨機抽一家</button>
  </header>
  <main>
    <section id="result" class="modal hidden">
      <div class="card">
        <button id="closeBtn" class="close">✕</button>
        <h2 id="r_name"></h2>
        <p id="r_addr"></p>
        <p id="r_meta"></p>
        <p id="r_desc"></p>
        <p><a id="r_map" target="_blank">在地圖開啟</a></p>
      </div>
    </section>

    <section class="list">
      <h2>候選咖啡廳</h2>
      <ul id="cafes"></ul>
    </section>
  </main>
  <script src="data/cafes.json" type="application/json"></script>
  <script src="app.js"></script>
</body>
</html>
